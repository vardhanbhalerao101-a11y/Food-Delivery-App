<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍔 Food Delivery App</h1>
        <p>Order your favourite food easily</p>
    </header>

    <main>
        <section>
            <h2>Search Restaurants</h2>
            <input type="text" id="searchBox" placeholder="Search restaurant or food">
            <button onclick="searchRestaurant()">Search</button>
            <p id="result"></p>
        </section>

        <section class="restaurants">
            <div class="restaurant">
                <h3>Pizza Palace</h3>
                <p>Pizza • Italian</p>
            </div>

            <div class="restaurant">
                <h3>Spice Kitchen</h3>
                <p>Indian • Biryani</p>
            </div>

            <div class="restaurant">
                <h3>Burger Hub</h3>
                <p>Burgers • Fast Food</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Food Delivery Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
